version: '3.9'
services:
  db:
    image: postgres:15-alpine
    container_name: analyst-decision-engine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analystpw
      POSTGRES_DB: analyst_decision_engine
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
